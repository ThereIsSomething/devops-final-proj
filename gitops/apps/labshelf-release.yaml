apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: labshelf
  namespace: labshelf
spec:
  interval: 1m
  releaseName: labshelf
  chart:
    spec:
      chart: ./helm/labshelf
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: labshelf
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    imageTag: "b1eb8e73f9d0e70b3e75b7ac838430ddd7823ac2"
    monitoring:
      enabled: true
