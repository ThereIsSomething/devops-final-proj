apiVersion: v1
kind: ConfigMap
metadata:
  name: labshelf-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  labshelf.json: |
    {
      "uid": "labshelf",
      "title": "LabShelf · Application",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "id": 1, "title": "HTTP requests / second", "type": "timeseries",
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (handler) (rate(http_requests_total{namespace=\"labshelf\"}[2m]))", "legendFormat": "{{handler}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "id": 2, "title": "95th percentile request duration", "type": "timeseries",
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"labshelf\"}[2m])))", "legendFormat": "p95"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "id": 3, "title": "Total observed requests", "type": "stat",
          "gridPos": {"h": 5, "w": 12, "x": 0, "y": 9},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(http_requests_total{namespace=\"labshelf\"})"}]
        },
        {
          "id": 4, "title": "Backend scrape targets UP", "type": "stat",
          "gridPos": {"h": 5, "w": 12, "x": 12, "y": 9},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(up{namespace=\"labshelf\"})"}]
        }
      ]
    }
