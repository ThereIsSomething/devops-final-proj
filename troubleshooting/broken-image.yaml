apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-lab
  namespace: labshelf-troubleshooting
spec:
  replicas: 1
  selector:
    matchLabels: { app: image-lab }
  template:
    metadata:
      labels: { app: image-lab }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:labshelf-deliberately-invalid
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 64Mi }
